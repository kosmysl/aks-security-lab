name: inspect-aks-network

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    RESOURCE_GROUP: rg-aks-sec-lab
    AKS_NAME: aks-sec-lab

jobs:
    inspect: 
        runs-on: ubuntu-latest
        environment: dev

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Log via OIDC to Azure
              uses: azure/login@v3
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
                
            - name: Show AKS network Configuration
              run: |
                az aks show \
                --resource-group "$RESOURCE_GROUP"
                --name "$AKS_NAME"
                --query '{
                kubernetesVersion:kubernetesVersion
                }' 
                --output json