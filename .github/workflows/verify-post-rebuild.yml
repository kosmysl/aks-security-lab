name: verify-post-rebuild

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-aks-sec-lab
  AKS_NAME: aks-sec-lab

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set Env variables
        run: |
          echo "KUBECONFIG=${{ runner.temp }}/aks-kubeconfig" >> "$GITHUB_ENV"

      - name: Show AKS network and add-on configuration
        run: |
          az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --query '{
              provisioningState: provisioningState,
              kubernetesVersion: kubernetesVersion,
              networkDataplane: networkProfile.networkDataplane,
              networkPolicy: networkProfile.networkPolicy,
              azurePolicyEnabled: addonProfiles.azurepolicy.enabled
            }' \
            --output json

      - name: Get AKS credentials
        run: |
          KUBELOGIN_VERSION="v0.2.19"

          curl -fsSL \
            "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip" \
            -o /tmp/kubelogin.zip

          unzip -q /tmp/kubelogin.zip -d /tmp/kubelogin

          sudo install \
            /tmp/kubelogin/bin/linux_amd64/kubelogin \
            /usr/local/bin/kubelogin

          kubelogin --version

          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --file "$KUBECONFIG" \
            --overwrite-existing

          kubelogin convert-kubeconfig \
            --login  azurecli \
            --kubeconfig "$KUBECONFIG"

          kubectl \
            --kubeconfig "$KUBECONFIG" \
             config current-context

      - name: Verify cluster access
        run: |
          kubectl get nodes -o wide \
            --kubeconfig "$KUBECONFIG" 

          kubectl get namespaces \
            --kubeconfig "$KUBECONFIG" 
          
          kubectl get pods -A \
            --kubeconfig "$KUBECONFIG" 

      - name: Verify Azure Policy resources
        run: |
          kubectl \
            get pods -n kube-system \
            --kubeconfig "$KUBECONFIG"
          
          kubectl \
          --kubeconfig "$KUBECONFIG" \
          get pods -n gatekeeper-system || true

          kubectl \
            get constrainttemplates || true \
            --kubeconfig "$KUBECONFIG"

      - name: Verify demo application
        run: |
          kubectl \
            get deployment -n demo || true \
            --kubeconfig "$KUBECONFIG"

          kubectl \
            get pods -n demo -o wide || true \
            --kubeconfig "$KUBECONFIG"

          kubectl \
            get service -n demo || true \
            --kubeconfig "$KUBECONFIG"

          kubectl get deployment \
            --namespace demo \
            --show-labels \
            --kubeconfig "$KUBECONFIG"

          kubectl get pods \
            --namespace demo \
            --show-labels \
            --kubeconfig "$KUBECONFIG"

          kubectl get service \
            --namespace demo \
            --output yaml \
            --kubeconfig "$KUBECONFIG"
